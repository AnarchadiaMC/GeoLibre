name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: Sync Upstream
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/opengeos/GeoLibre.git
          git fetch upstream main

      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main

          if git merge upstream/main --no-edit; then
            echo "Successfully merged upstream/main with no conflicts. Pushing directly to origin main."
            git push origin main
          else
            echo "Conflicts detected while merging upstream/main. Aborting merge on main and creating a PR."
            git merge --abort

            SYNC_BRANCH="sync-upstream"
            git checkout -B "$SYNC_BRANCH" upstream/main
            git push origin "$SYNC_BRANCH" --force

            EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')

            if [ -n "$EXISTING_PR" ]; then
              echo "Pull request #$EXISTING_PR already exists for $SYNC_BRANCH."
            else
              gh pr create \
                --title "Automated Sync: Merge upstream changes" \
                --body "Automated daily sync detected merge conflicts when merging \`upstream/main\` into \`main\`. Please resolve conflicts to merge the latest upstream changes." \
                --head "$SYNC_BRANCH" \
                --base main
            fi
          fi
